<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>English Quest</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="welcome-card">

            <div class="logo">
                <div class="logo-icon">🌟</div>

                <div>
                    <h1>English Quest</h1>
                    <p>Tu aventura diaria en inglés</p>
                </div>
            </div>

            <div class="welcome-content">
                <span class="welcome-badge">🎯 DAILY ENGLISH</span>

                <h2>
                    ¡Hola! 👋
                </h2>

                <p class="welcome-text">
                    Elige tu nombre para comenzar la actividad de hoy.
                </p>

                <div class="student-buttons">

                    <button class="student-button" data-name="Mariangel" >
                        <span class="student-avatar">👧</span>

                        <span class="student-info">
                            <strong>Mariangel</strong>
                            <small>Entrar a mi aventura</small>
                        </span>

                        <span class="arrow">→</span>
                    </button>

                    <button class="student-button" data-name="Ana Victoria">
                        <span class="student-avatar">👧</span>

                        <span class="student-info">
                            <strong>Ana Victoria</strong>
                            <small>Entrar a mi aventura</small>
                        </span>

                        <span class="arrow">→</span>
                    </button>

                </div>
            </div>

        </section>

        <footer>
            <span>⭐ Learn</span>
            <span>🎮 Play</span>
            <span>🚀 Grow</span>
        </footer>

    </main>

    <script src="app.js"></script>
</body>
</html>
